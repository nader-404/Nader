<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مبارزة الكونغ فو</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171329;color:white;font-family:Arial,sans-serif;text-align:center}
h1{font-size:30px;margin:15px}
button,select{border:0;border-radius:13px;padding:13px;background:#ffd36b;color:#251a24;font-weight:bold;font-size:16px;cursor:pointer;touch-action:none}
.top{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}
.hud{display:flex;justify-content:space-around;gap:15px;margin:12px}
.status{width:44%;font-weight:bold}
.bar{height:17px;background:#44344b;border:2px solid white;border-radius:20px;overflow:hidden;margin-top:7px}
.fill{height:100%;background:#53e47b;width:100%;transition:width .15s}
.energy{background:#20d9f2}
canvas{display:block;width:96%;max-width:1000px;margin:auto;border:4px solid #ffd36b;border-radius:20px;touch-action:none}
#message{font-size:23px;font-weight:bold;margin:12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-width:800px;margin:auto}
.pad{background:#211c3b;border-radius:18px;padding:12px}
.pad h3{margin:5px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{min-height:53px}
.special{grid-column:3}
@media(max-width:450px){h1{font-size:24px}.keys button{font-size:14px;padding:10px 4px}.controls{gap:6px;padding:7px}.pad{padding:7px}}
</style>
</head>
<body>
<h1>🥋 مبارزة الكونغ فو</h1>
<div class="top">
<button id="restart">جولة جديدة</button>
<select id="difficulty" aria-label="مستوى الكمبيوتر">
<option value="0.65">سهل</option>
<option value="1">متوسط</option>
<option value="1.35">صعب</option>
<option value="1.7">أسطوري</option>
</select>
</div>
<div class="hud">
<div class="status">المقاتل الأول
<div class="bar"><div id="hp1" class="fill"></div></div>
<div class="bar"><div id="en1" class="fill energy"></div></div>
</div>
<div class="status">المقاتل الثاني
<div class="bar"><div id="hp2" class="fill"></div></div>
<div class="bar"><div id="en2" class="fill energy"></div></div>
</div>
</div>
<canvas id="game" width="960" height="520"></canvas>
<div id="message">ابدأ القتال!</div>
<div class="controls">
<div class="pad">
<h3>المقاتل الأول</h3>
<div class="keys">
<button data-key="right">▶</button>
<button data-key="jump">قفز</button>
<button data-key="left">◀</button>
<button data-key="kick">ركلة</button>
<button data-key="punch">لكمة</button>
<button data-key="block">صد</button>
<button class="special" data-key="special">خاصة ⚡</button>
</div>
</div>
<div class="pad">
<h3>المقاتل الثاني (تحكم تجريبي)</h3>
<div class="keys">
<button data-key="bright">▶</button>
<button data-key="bjump">قفز</button>
<button data-key="bleft">◀</button>
<button data-key="bkick">ركلة</button>
<button data-key="bpunch">لكمة</button>
<button data-key="bblock">صد</button>
<button class="special" data-key="bspecial">خاصة ⚡</button>
</div>
</div>
</div>
<script>
(()=>{
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=520;
const keys={};
let last=0,round=1,finished=false,roundTimer=0;
let difficulty=1;
function fighter(x,color,player){
 return {x,y:400,vx:0,vy:0,ground:400,health:100,energy:100,
 color,player,face:player?1:-1,action:"idle",time:0,
 block:false,hit:0,walk:0,attackCooldown:0,stun:0};
}
let p=fighter(300,"#171421",true);
let b=fighter(660,"#eee7dc",false);
function reset(){
 p=fighter(300,"#171421",true);
 b=fighter(660,"#eee7dc",false);
 finished=false;
 document.getElementById("message").textContent="الجولة "+round+" — ابدأ القتال!";
}
document.getElementById("restart").onclick=()=>{round=1;reset()};
document.getElementById("difficulty").onchange=e=>{
 difficulty=+e.target.value;
};
function press(k,on){
 keys[k]=on;
}
document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("pointerdown",e=>{e.preventDefault();press(k,true)});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>
 btn.addEventListener(ev,()=>press(k,false)));
});
document.addEventListener("keydown",e=>{
 const map={a:"left",d:"right",w:"jump",f:"punch",g:"kick",s:"block",h:"special"};
 if(map[e.key.toLowerCase()]){e.preventDefault();press(map[e.key.toLowerCase()],true)}
});
document.addEventListener("keyup",e=>{
 const map={a:"left",d:"right",w:"jump",f:"punch",g:"kick",s:"block",h:"special"};
 if(map[e.key.toLowerCase()])press(map[e.key.toLowerCase()],false);
});
function action(f,name){
 if(f.attackCooldown>0||f.stun>0||finished)return;
 if(name==="special"&&f.energy<35)return;
 if(name==="special")f.energy-=35;
 f.action=name;f.time=0;f.attackCooldown=name==="special"?.75:.48;
}
function control(f,p1,opponent,dt){
 f.time+=dt;
 f.attackCooldown=Math.max(0,f.attackCooldown-dt);
 f.stun=Math.max(0,f.stun-dt);
 f.hit=Math.max(0,f.hit-dt);
 f.face=opponent.x>f.x?1:-1;
 if(f.stun>0){f.vx*=.88;return}
 const prefix=p1?"":"b";
 let left=keys[prefix+"left"],right=keys[prefix+"right"];
 let jump=keys[prefix+"jump"];
 let block=keys[prefix+"block"];
 if(p1){
  left=keys.left;right=keys.right;jump=keys.jump;block=keys.block;
 }
 if(left){f.vx-=950*dt;f.walk+=dt*10}
 if(right){f.vx+=950*dt;f.walk+=dt*10}
 f.vx*=Math.pow(.001,dt);
 f.vx=Math.max(-260,Math.min(260,f.vx));
 f.x+=f.vx*dt;
 f.x=Math.max(60,Math.min(900,f.x));
 if(jump&&f.y>=f.ground-1){f.vy=-510}
 if(f.y<f.ground||f.vy<0){
  f.vy+=1250*dt;f.y+=f.vy*dt;
  if(f.y>=f.ground){f.y=f.ground;f.vy=0}
 }
 f.block=!!block;
 if(p1){
  if(keys.punch)action(f,"punch");
  if(keys.kick)action(f,"kick");
  if(keys.special)action(f,"special");
 }else{
  const distance=Math.abs(opponent.x-f.x);
  if(distance>135)f.vx+=Math.sign(opponent.x-f.x)*90*difficulty*dt;
  else if(distance<85)f.vx-=Math.sign(opponent.x-f.x)*65*dt;
  if(Math.random()<dt*(.75*difficulty)&&distance<155)
   action(f,Math.random()<.5?"punch":"kick");
  f.block=Math.random()<.18*difficulty;
 }
}
function hitTest(a,b){
 if(a.action!=="punch"&&a.action!=="kick"&&a.action!=="special")return;
 let duration=a.action==="special"?.48:.3;
 if(a.time>duration)return;
 if(a.didHit)return;
 if(Math.abs(a.x-b.x)<125&&Math.abs(a.y-b.y)<100){
  a.didHit=true;
  if(!b.block){
   b.health=Math.max(0,b.health-(a.action==="special"?22:a.action==="kick"?13:9));
   b.stun=.18;
   b.vx=b.face*180;
   b.hit=.2;
   a.energy=Math.min(100,a.energy+12);
   sound(110);
  }else{
   b.energy=Math.max(0,b.energy-8);
   sound(190);
  }
 }
 if(a.time>duration+.1)a.didHit=false;
}
function sound(freq){
 try{
  const ac=new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=freq;g.gain.value=.07;
  o.connect(g);g.connect(ac.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);
  o.stop(ac.currentTime+.13);
 }catch(e){}
}
function background(){
 const sky=ctx.createLinearGradient(0,0,0,520);
 sky.addColorStop(0,"#32204f");sky.addColorStop(.5,"#ff805b");sky.addColorStop(1,"#ffc16c");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffe16d";ctx.beginPath();ctx.arc(480,205,105,0,Math.PI*2);ctx.fill();
 for(let i=0;i<5;i++){
  let x=i*240-70;
  ctx.fillStyle=i%2?"#704b77":"#59446f";
  ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x+125,230+(i%2)*35);ctx.lineTo(x+270,390);ctx.fill();
 }
 ctx.fillStyle="#4b344f";ctx.fillRect(0,410,W,110);
 ctx.strokeStyle="#eeb477";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,410);ctx.lineTo(W,410);ctx.stroke();
 for(let i=0;i<12;i++){
  ctx.strokeStyle="rgba(255,200,130,.17)";
  ctx.beginPath();ctx.moveTo(i*90,440);ctx.lineTo(i*90+30,520);ctx.stroke();
 }
}
function line(x1,y1,x2,y2,width,color){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawFighter(f){
 const t=f.time;
 const active=f.action!=="idle"&&t<(f.action==="special"?.75:.55);
 let swing=active?Math.sin(Math.min(1,t/.3)*Math.PI):0;
 let walk=Math.sin(f.walk)*Math.min(1,Math.abs(f.vx)/100);
 let lean=f.hit?-.2:0;
 let crouch=f.block?12:0;
 let x=f.x,y=f.y;
 let face=f.face;
 let skin="#c88b65";
 let cloth=f.color;
 ctx.save();ctx.translate(x,y);ctx.scale(face,1);
 // shadow
 ctx.fillStyle="rgba(15,10,30,.35)";
 ctx.beginPath();ctx.ellipse(0,3,49,9,0,0,7);ctx.fill();
 // legs
 let legSwing=walk*18;
 line(-9,-65, -15+legSwing,-32,17,cloth);
 line(-15+legSwing,-32,-20+legSwing,-4,13,cloth);
 line(10,-65,15-legSwing,-33,17,cloth);
 line(15-legSwing,-33,20-legSwing,-4,13,cloth);
 line(-20+legSwing,-4,-3+legSwing,-2,11,cloth);
 line(20-legSwing,-4,38-legSwing,-2,11,cloth);
 // body
 ctx.save();ctx.rotate(lean+Math.sin(t*3)*.025);
 ctx.fillStyle=cloth;
 ctx.beginPath();ctx.moveTo(-23,-135);ctx.lineTo(23,-135);
 ctx.lineTo(30,-70);ctx.lineTo(0,-58);ctx.lineTo(-30,-70);ctx.closePath();ctx.fill();
 // gi collar
 ctx.strokeStyle=f.player?"#a94a36":"#777";
 ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-10,-132);ctx.lineTo(0,-102);ctx.lineTo(13,-133);ctx.stroke();
 ctx.fillStyle="#c23e36";ctx.fillRect(-22,-76,44,7);
 // arms
 let punch= f.action==="punch"||f.action==="special";
 let kick=f.action==="kick";
 let armX=punch?75*swing: kick?25:28;
 let armY=punch?-112:-105;
 line(-19,-125,-35,-103,13,cloth);
 line(-35,-103,-28,-85,12,skin);
 line(19,-125,armX,armY,14,cloth);
 line(armX,armY,armX+(punch?20:10),armY+5,12,skin);
 // fists
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(armX+(punch?20:10),armY+5,9,0,7);ctx.fill();
 // head
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-153,18,0,7);ctx.fill();
 ctx.fillStyle="#17131d";ctx.beginPath();ctx.arc(0,-161,19,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(-17,-161,34,8);
 ctx.fillStyle="white";ctx.fillRect(5,-155,5,3);
 if(f.player){
  ctx.fillStyle="#d53d38";ctx.fillRect(-19,-170,35,5);
 }
 if(f.block){
  line(22,-125,42,-155,13,cloth);
  line(42,-155,34,-170,12,skin);
 }
 if(kick){
  line(10,-67,65*swing,-40,16,cloth);
  line(65*swing,-40,90*swing,-37,12,skin);
 }
 if(f.action==="special"&&t<.5){
  ctx.strokeStyle="#39eaff";ctx.lineWidth=7;
  ctx.beginPath();ctx.arc(35,-95,35,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
 ctx.restore();
}
function updateUI(){
 document.getElementById("hp1").style.width=p.health+"%";
 document.getElementById("hp2").style.width=b.health+"%";
 document.getElementById("en1").style.width=p.energy+"%";
 document.getElementById("en2").style.width=b.energy+"%";
}
function finish(){
 if(finished)return;
 finished=true;
 let winner=p.health<=0?"الكمبيوتر فاز!":"أنت فزت بالجولة!";
 document.getElementById("message").textContent=winner;
 roundTimer=2.2;
}
function loop(now){
 let dt=Math.min((now-last)/1000||0,.032);last=now;
 background();
 if(!finished){
  control(p,true,b,dt);
  control(b,false,p,dt);
  p.energy=Math.min(100,p.energy+5*dt);
  b.energy=Math.min(100,b.energy+5*dt);
  hitTest(p,b);hitTest(b,p);
  if(p.health<=0||b.health<=0)finish();
 }
 drawFighter(p);drawFighter(b);
 updateUI();
 if(finished){
  roundTimer-=dt;
  if(roundTimer<=0){
   if(p.health<=0||b.health<=0){
    round++;
    if(round>3){round=1}
   }
   reset();
  }
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
